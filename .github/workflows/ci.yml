name: CI
on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches: [main, release]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ 'push' == 'pull_request' && github.ref || github.sha }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  CARGO_TERM_COLOR: always
  BUZZ_TEST_POSTGRES_PASSWORD: buzz_dev
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

permissions:
  contents: read
  id-token: write

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      # Restored: the racecar patch constant-folded github.event_name to 'push', which
      # made this "a manual dispatch tests everything" selector permanently FALSE while
      # the _ci-*.yml callees kept the real github.event_name. The two halves then
      # disagreed: the required-check mirrors below always run (their own guard folded to
      # a constant TRUE) and assert `= success`, but a callee job whose only remaining
      # condition was inputs.<flag> skipped, so the mirror asserted on 'skipped'. With a
      # workflows-only patch commit, dorny/paths-filter sets rust+desktop+mobile but not
      # web, so the Web required check could not pass.
      rust: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.rust }}
      desktop: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.desktop }}
      desktop-rust: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.desktop-rust }}
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
      mobile: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.mobile }}
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        fetch-depth: 2
    - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616   # v1
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d   # v4.0.3
      id: filter
      with:
        token: ''
        filters: |
          rust:
            - 'crates/**'
            - 'migrations/**'
            - 'schema/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'rust-toolchain.toml'
            - '.config/nextest.toml'
            - 'scripts/postgres-test-*.sh'
            - 'scripts/reconcile-schema-after-pgschema.sql'
            - 'bin/pgschema'
            - 'bin/.pgschema-*.pkg'
            - 'scripts/check-postgres-test-discovery.py'
            - 'scripts/test-postgres-test-discovery.sh'
            - 'scripts/test-postgres-test-wrapper.sh'
            - 'deny.toml'
            - '.github/workflows/ci.yml'
            - '.github/workflows/_ci-*.yml'
            - 'scripts/run-tests.sh'
            - 'scripts/model-capabilities.json'
            - 'scripts/normative-corpus.json'
            - 'justfile'
          desktop:
            - 'scripts/model-capabilities.json'
            - 'scripts/normative-corpus.json'
            - 'desktop/**'
            - '!desktop/src-tauri/**'
            - 'pnpm-lock.yaml'
          desktop-rust:
            - 'desktop/src-tauri/**'
          web:
            - 'web/**'
            - 'pnpm-lock.yaml'
          mobile:
            - 'mobile/**'
            - 'scripts/mobile-release.sh'
            - 'scripts/mobile-worktree-overrides.sh'
            - 'scripts/mobile-worktree-clean.sh'
            - 'scripts/publish-mobile-release-candidate.sh'
            - 'scripts/release-rulesets.sh'
            - 'scripts/test-mobile-release-contract.sh'
            - 'scripts/test-mobile-release-candidate-publisher.sh'
            - 'scripts/test-mobile-worktree-overrides.sh'
            - '.github/workflows/mobile-release-candidate.yml'
            - '.github/workflows/ci.yml'
            - '.github/workflows/_ci-*.yml'
    - name: Validate PostgreSQL test discovery
      if: ${{ 'push' == 'push' || steps.filter.outputs.rust == 'true' }}
      run: |
        scripts/test-postgres-test-discovery.sh
        scripts/test-postgres-test-wrapper.sh
    - name: Release workflow source contract
      run: scripts/test-release-ref-contract.sh
    - name: Relay image eligibility contract
      run: scripts/test-relay-image-eligibility-workflow.sh
    - name: Desktop release candidate contract
      run: scripts/test-desktop-release-candidate.sh
    - name: OSS desktop promotion contract
      run: |
        scripts/test-oss-desktop-promotion.sh
        scripts/test-oss-desktop-promotion-behavior.sh
    - name: Mobile release contract
      run: |
        scripts/test-mobile-release-contract.sh
        scripts/test-mobile-release-candidate-publisher.sh
    - name: Desktop instance environment contract
      run: scripts/test-desktop-instance-detection.sh
    - name: Mobile worktree identity contract
      run: scripts/test-mobile-worktree-overrides.sh
    - name: Codex security review contract
      run: just security-review-check
    - name: Rust cache contract
      run: |
        scripts/test-rust-cache-contract.sh
        scripts/test-rust-cache-contract-regressions.sh
    - name: CI required-context isolation contract
      run: scripts/test-ci-required-context-isolation.sh
    - name: File size policy
      run: just file-size-check

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  dead-token-guard:
    name: Dead Token Reference Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Check for dead API token references in client code
      run: |
        # Fail if dead API token patterns reappear in desktop, mobile, docs, or config.
        # Relay crates are excluded — they still use token auth internally.
        PATTERNS='TokenScope|MintTokenResponse|hasApiToken|spr_tok_'
        PATHS='desktop/src/ desktop/tests/ mobile/test/ mobile/lib/ .env.example'
        EXCLUDES='--exclude-dir=node_modules --exclude-dir=.dart_tool'
        if grep -rn $EXCLUDES -E "$PATTERNS" $PATHS 2>/dev/null; then
          echo "::error::Dead API token references found in client code. See above."
          exit 1
        fi
        echo "No dead token references found."

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  rust:
    name: Rust
    needs: [changes]
    if: ${{ 'push' == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.desktop-rust == 'true' }}
    uses: ./.github/workflows/_ci-rust.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      desktop_rust: ${{ needs.changes.outputs.desktop-rust == 'true' }}
      lane: required

  rust-cross-compile-domain:
    name: Rust Cross-Compile
    needs: [changes]
    if: ${{ 'push' == 'push' || needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/_ci-rust.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      desktop_rust: ${{ needs.changes.outputs.desktop-rust == 'true' }}
      lane: cross-compile

  desktop-domain:
    name: Desktop Domain
    needs: [changes]
    if: ${{ 'push' == 'push' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/_ci-desktop.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      desktop: ${{ needs.changes.outputs.desktop == 'true' }}
      desktop_rust: ${{ needs.changes.outputs.desktop-rust == 'true' }}

  relay-artifacts-domain:
    name: Relay Artifact Producer
    needs: [changes]
    if: ${{ 'push' == 'push' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/_ci-relay.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      desktop: ${{ needs.changes.outputs.desktop == 'true' }}
      desktop_rust: ${{ needs.changes.outputs.desktop-rust == 'true' }}
      lane: artifacts

  postgres-domain:
    name: PostgreSQL Domain
    needs: [changes, relay-artifacts-domain]
    if: ${{ 'push' == 'push' || needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/_ci-relay.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      desktop: ${{ needs.changes.outputs.desktop == 'true' }}
      desktop_rust: ${{ needs.changes.outputs.desktop-rust == 'true' }}
      lane: postgres

  desktop-macos-domain:
    name: Desktop macOS Domain
    needs: [changes]
    if: ${{ 'push' == 'push' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/_ci-desktop-macos.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      desktop: ${{ needs.changes.outputs.desktop == 'true' }}
      desktop_rust: ${{ needs.changes.outputs.desktop-rust == 'true' }}

  relay-domain:
    name: Relay and PostgreSQL
    needs: [changes, relay-artifacts-domain]
    if: ${{ 'push' == 'push' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/_ci-relay.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      desktop: ${{ needs.changes.outputs.desktop == 'true' }}
      desktop_rust: ${{ needs.changes.outputs.desktop-rust == 'true' }}
      lane: required

  clients:
    name: Clients
    needs: [changes]
    if: ${{ 'push' == 'push' || needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile == 'true' }}
    uses: ./.github/workflows/_ci-clients.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      web: ${{ needs.changes.outputs.web == 'true' }}
      mobile: ${{ needs.changes.outputs.mobile == 'true' }}
      lane: required

  mobile-swift-domain:
    name: Mobile Swift Domain
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/_ci-clients.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      web: ${{ needs.changes.outputs.web == 'true' }}
      mobile: ${{ needs.changes.outputs.mobile == 'true' }}
      lane: mobile-swift

  security-domain:
    name: Security Domain
    needs: [changes]
    if: ${{ 'push' == 'push' || needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/_ci-security.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      rust: ${{ needs.changes.outputs.rust == 'true' }}

  rust-lint:
    name: Rust Lint
    if: always() && needs.changes.result == 'success' && ('push' == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.desktop-rust == 'true')
    needs: [changes, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check Rust Lint result
      env:
        RESULT: ${{ needs.rust.outputs.rust_lint_result }}
      run: test "$RESULT" = success

  unit-tests:
    name: Unit Tests
    if: always() && needs.changes.result == 'success' && ('push' == 'push' || needs.changes.outputs.rust == 'true')
    needs: [changes, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check Unit Tests result
      env:
        RESULT: ${{ needs.rust.outputs.unit_tests_result }}
      run: test "$RESULT" = success

  # Mirrors a windows-latest job that is gated off on forks, so its result is
  # 'skipped' here and `test "$RESULT" = success` can never pass off-upstream.
  windows-rust:
    name: Windows Rust (x86_64-pc-windows-msvc)
    if: always() && github.repository == 'block/buzz' && needs.changes.result == 'success' && ('push' == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.desktop-rust == 'true')
    needs: [changes, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check Windows Rust result
      env:
        RESULT: ${{ needs.rust.outputs.windows_rust_result }}
      run: test "$RESULT" = success

  desktop:
    name: Desktop
    if: always() && needs.changes.result == 'success' && ('push' == 'push' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true')
    needs: [changes, desktop-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check Desktop result
      env:
        RESULT: ${{ needs.desktop-domain.outputs.desktop_result }}
      run: test "$RESULT" = success

  # Mirrors a macos-latest job that is gated off on forks, so its result is
  # 'skipped' here and `test "$RESULT" = success` can never pass off-upstream.
  desktop-build-macos:
    name: Desktop Build (macOS)
    if: always() && github.repository == 'block/buzz' && needs.changes.result == 'success' && ('push' == 'push' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true')
    needs: [changes, desktop-macos-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check Desktop Build (macOS) result
      env:
        RESULT: ${{ needs.desktop-macos-domain.outputs.desktop_macos_result }}
      run: test "$RESULT" = success

  desktop-e2e-relay:
    name: Desktop E2E Relay
    if: always() && needs.changes.result == 'success' && ('push' == 'push' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true')
    needs: [changes, relay-artifacts-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check Desktop E2E Relay result
      env:
        RESULT: ${{ needs.relay-artifacts-domain.outputs.desktop_e2e_relay_result }}
      run: test "$RESULT" = success

  desktop-e2e-integration:
    name: Desktop E2E Integration
    if: always() && needs.changes.result == 'success' && needs.relay-artifacts-domain.result == 'success' && ('push' == 'push' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.desktop-rust == 'true' || needs.changes.outputs.rust == 'true')
    needs: [changes, relay-artifacts-domain, relay-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check Desktop E2E Integration result
      env:
        RESULT: ${{ needs.relay-domain.outputs.desktop_e2e_integration_result }}
      run: test "$RESULT" = success

  backend-integration:
    name: Backend Integration (relay e2e)
    if: always() && needs.changes.result == 'success' && needs.relay-artifacts-domain.result == 'success' && ('push' == 'push' || needs.changes.outputs.rust == 'true')
    needs: [changes, relay-artifacts-domain, relay-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check Backend Integration result
      env:
        RESULT: ${{ needs.relay-domain.outputs.backend_integration_result }}
      run: test "$RESULT" = success

  postgres-tests:
    name: PostgreSQL Tests
    if: always() && needs.changes.result == 'success' && needs.relay-artifacts-domain.result == 'success' && ('push' == 'push' || needs.changes.outputs.rust == 'true')
    needs: [changes, relay-artifacts-domain, postgres-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check PostgreSQL Tests result
      env:
        RESULT: ${{ needs.postgres-domain.outputs.postgres_tests_result }}
      run: test "$RESULT" = success

  relay-e2e:
    name: Relay E2E
    if: always() && needs.changes.result == 'success' && needs.relay-artifacts-domain.result == 'success' && ('push' == 'push' || needs.changes.outputs.rust == 'true')
    needs: [changes, relay-artifacts-domain, relay-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check Relay E2E result
      env:
        RESULT: ${{ needs.relay-domain.outputs.relay_e2e_result }}
      run: test "$RESULT" = success

  web:
    name: Web
    if: always() && needs.changes.result == 'success' && ('push' == 'push' || needs.changes.outputs.web == 'true')
    needs: [changes, clients]
